[package]
name = "finmoney"
version = "4.0.1"
edition = "2024"
# Internal from 2026-08-31 by operator decision: the repository is private and the crate is no
# longer published. `finmoney` is HFAT's money type and its asset identity lives in the consumer's
# registry, which makes it near-unusable to an outside caller. Consequence for v5: no semver
# obligation to anyone outside this workspace, so the API may break freely. The 12 versions already
# on crates.io cannot be withdrawn — crates.io yanks, it never deletes — and are deliberately left
# as they are.
publish = false
authors = ["Muntean Maxim <mixme2@gmail.com>"]
description = "Precise money library for Rust — currency-aware arithmetic, exchange-grade tick handling, configurable rounding. Built for trading systems."
license = "MIT OR Apache-2.0"
repository = "https://github.com/MixMe/finmoney"
homepage = "https://github.com/MixMe/finmoney"
documentation = "https://docs.rs/finmoney"
keywords = ["money", "currency", "decimal", "finance", "trading"]
categories = ["data-structures", "mathematics", "science"]
readme = "README.md"
include = [
    "src/**/*",
    "tests/**/*",
    "examples/**/*",
    "benches/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "CHANGELOG.md",
    "llms.txt"
]
rust-version = "1.90"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1
debug = true

[dependencies]
rust_decimal = { version = "1.36", features = ["maths"] }
rust_decimal_macros = "1.36"
tinystr = { version = "0.8", features = ["serde"] }
serde = { version = "1.0", features = ["derive"], optional = true }


[dev-dependencies]
criterion = "0.8"
proptest = "1.6"
serde_json = "1.0"

[features]
default = []
serde = ["dep:serde", "rust_decimal/serde-with-str", "tinystr/serde"]

[[bench]]
name = "money_benchmarks"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]